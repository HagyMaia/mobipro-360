<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFC800" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0D192C" />
      <stop offset="85%" stop-color="#070D18" />
    </radialGradient>
  </defs>

  <!-- Dark Navy Box -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#FFC800" stroke-width="4" stroke-opacity="0.45" />

  <!-- Dashed Orbit Ring -->
  <circle cx="256" cy="236" r="170" fill="none" stroke="#FFC800" stroke-width="12" stroke-dasharray="16 13" stroke-linecap="round" opacity="0.9" />

  <!-- Yellow Map Pin -->
  <path d="M256 90 C186 90 130 146 130 216 C130 300 256 385 256 385 C256 385 382 300 382 216 C382 146 326 90 256 90 Z" fill="url(#goldGrad)" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.5))" />

  <!-- Inner Dark Circle -->
  <circle cx="256" cy="208" r="48" fill="#070D18" />

  <!-- SR Text -->
  <text x="256" y="222" fill="#FFC800" font-size="44" font-weight="900" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">SR</text>

  <!-- MOTORISTA Pill -->
  <rect x="106" y="416" width="300" height="54" rx="27" fill="url(#goldGrad)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
  <text x="256" y="451" fill="#070D18" font-size="23" font-weight="900" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="3.5">MOTORISTA</text>
</svg>
